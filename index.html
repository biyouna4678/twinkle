<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="referrer" content="no-referrer">
    
    <link rel="manifest" href="./manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="液态通讯">
    <meta name="theme-color" content="#000000">
    
    <title>液态玻璃通讯 (最终完美版)</title>

    <!-- 错误捕获 -->
    <script>
      window.addEventListener('error', function(e) {
        if (e.target && (e.target.tagName === 'SCRIPT' || e.target.tagName === 'LINK')) {
          alert('❌ 资源加载失败:\n' + (e.target.src || e.target.href));
        } else {
          alert('❌ 运行错误:\n' + e.message);
        }
      }, true);
    </script>
    
    <!-- 引入样式与字体 -->
    <link rel="stylesheet" href="./css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@500;600;700;900&family=Playfair+Display:ital,wght@1,500;1,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="h-screen font-sans antialiased overflow-hidden m-0 p-0" style="
    background-image: url('https://i.ibb.co/VWmvYVTV/IMG-7150.jpg'); 
    background-size: cover; 
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
">

    <div class="w-full px-0 flex flex-col h-full relative" 
         x-data="{ ...chatApp(), ...callManager(), ...mapManager(), ...transferManager() }" 
         x-init="initChat(); initCall();"
         @beforeunload.window="stopTimer(); stopCamera(); if(recognition) recognition.stop();">

        <!-- 隐藏文件输入 -->
        <input type="file" id="native-file-picker" accept="image/*" class="hidden" @change="handleImageUpload($event)">
        <input type="file" id="native-camera-picker" accept="image/*" capture="environment" class="hidden" @change="handleImageUpload($event)">

        <!-- ================= 1. 聊天主界面 ================= -->
        <div class="w-full h-full flex flex-col transition-opacity transform duration-300"
             :class="callState !== 'idle' && !isMinimized ? 'opacity-0 scale-95 pointer-events-none' : 'opacity-100 scale-100'">
            
            <!-- 顶部固定 -->
            <div class="flex items-center justify-between w-full gap-2 shrink-0 mb-4 px-3 relative z-40 pt-4">
                <div class="wet-glass rounded-full h-[56px] px-3 flex items-center w-fit max-w-[75%] transition-all duration-300">
                    <button class="p-1 ml-0 text-black hover:text-black transition-colors rounded-full hover:bg-white/20 shrink-0" @click="alert('执行返回操作')">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="3" stroke="currentColor" class="w-5 h-5"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5" /></svg>
                    </button>
                    <img src="https://i.ibb.co/3mf7FgyL/IMG-6559.jpg" class="w-8 h-8 rounded-full object-cover mx-3 shrink-0 shadow-sm">
                    <div class="flex-1 min-w-0 flex flex-col justify-center pl-1 pr-3">
                        <span class="text-gray-900 font-bold text-[14px] truncate">Yosali</span>
                        <span class="text-gray-700/80 text-[10px] mt-0.5 truncate">
                            <template x-if="callState !== 'idle' && isMinimized && subtitlesOn">
                                <span class="text-green-600 animate-pulse" x-text="callType === 'video' ? '视频通话中...' : '语音通话中...'"></span>
                            </template>
                            <template x-if="(callState === 'idle' || !isMinimized) && subtitlesOn">
                                <span>对方正在输入中…</span>
                            </template>
                        </span>
                    </div>
                </div>

                <div class="flex items-center gap-2 relative">
                    <div class="relative">
                        <button class="wet-glass rounded-full w-[56px] h-[56px] flex items-center justify-center shrink-0 text-gray-700/80" @click="showCallSelector = !showCallSelector">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6"><path stroke-linecap="round" stroke-linejoin="round" d="M2.25 6.75c0 8.284 6.716 15 15 15h2.25a2.25 2.25 0 002.25-2.25v-1.372c0-.516-.351-.966-.852-1.091l-4.423-1.106c-.44-.11-.902.055-1.173.417l-.97 1.293c-.282.376-.769.542-1.21.38a12.035 12.035 0 01-7.143-7.143c-.162-.441.004-.928.38-1.21l1.293-.97c.363-.271.527-.734.417-1.173L6.963 3.102a1.125 1.125 0 00-1.091-.852H4.5A2.25 2.25 0 002.25 4.5v2.25z" /></svg>
                        </button>
                        <div x-show="showCallSelector" @click="showCallSelector = false" class="fixed inset-0 z-[90] bg-transparent"></div>
                        <div x-show="showCallSelector" class="wet-glass absolute right-0 top-14 w-[140px] rounded-[20px] overflow-hidden z-[100] pointer-events-auto" style="display: none;">
                            <button type="button" @click.stop="startCall('voice', 'receiving')" class="w-full text-left flex items-center gap-3 px-4 py-3.5 border-b border-gray-400/30 active:bg-white/40 cursor-pointer text-gray-800 text-[15px]">
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5 text-gray-700"><path stroke-linecap="round" stroke-linejoin="round" d="M2.25 6.75c0 8.284 6.716 15 15 15h2.25a2.25 2.25 0 002.25-2.25v-1.372c0-.516-.351-.966-.852-1.091l-4.423-1.106c-.44-.11-.902.055-1.173.417l-.97 1.293c-.282.376-.769.542-1.21.38a12.035 12.035 0 01-7.143-7.143c-.162-.441.004-.928.38-1.21l1.293-.97c.363-.271.527-.734.417-1.173L6.963 3.102a1.125 1.125 0 00-1.091-.852H4.5A2.25 2.25 0 002.25 4.5v2.25z" /></svg>
                                <span>语音通话</span>
                            </button>
                            <button type="button" @click.stop="startCall('video', 'receiving')" class="w-full text-left flex items-center gap-3 px-4 py-3.5 active:bg-white/40 cursor-pointer text-gray-800 text-[15px]">
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5 text-gray-700"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 10.5l4.72-4.72a.75.75 0 011.28.53v11.38a.75.75 0 01-1.28.53l-4.72-4.72M4.5 18.75h9a2.25 2.25 0 002.25-2.25v-9a2.25 2.25 0 00-2.25-2.25h-9A2.25 2.25 0 002.25 7.5v9a2.25 2.25 0 002.25 2.25z" /></svg>
                                <span>视频通话</span>
                            </button>
                        </div>
                    </div>
                    <button class="wet-glass rounded-full w-[56px] h-[56px] flex items-center justify-center shrink-0 text-gray-700/80" @click="isMenuOpen = !isMenuOpen">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-6 h-6"><circle cx="4.5" cy="5" r="2.5" /><rect x="10" y="3" width="13" height="4" rx="2" /><circle cx="4.5" cy="12" r="2.5" /><rect x="10" y="10" width="13" height="4" rx="2" /><circle cx="4.5" cy="19" r="2.5" /><rect x="10" y="17" width="13" height="4" rx="2" /></svg>
                    </button>
                </div>
            </div>

            <!-- 消息流 -->
            <div class="flex-1 overflow-y-auto pb-6 flex flex-col gap-5 px-4 relative z-10 hide-scrollbar" id="chat-scroll">
                <template x-for="(msg, index) in messages" :key="msg.id">
                    <div class="flex w-full animate-fade-in-up" :class="msg.sender === 'me' ? 'justify-end' : 'justify-start'">
                        <div class="flex flex-col w-fit max-w-[80%]" :class="msg.sender === 'me' ? 'items-end' : 'items-start'">
                            <div class="flex flex-col w-fit" :class="msg.sender === 'me' ? 'items-end' : 'items-start'">
                                <div class="flex gap-2.5 mb-1.5" :class="msg.sender === 'me' ? 'items-center' : 'items-start'">
                                    <template x-if="msg.sender === 'yosali'">
                                        <img src="https://i.ibb.co/3mf7FgyL/IMG-6559.jpg" class="w-8 h-8 rounded-full object-cover shrink-0 shadow-sm mt-0.5">
                                    </template>
                                    <div class="flex flex-col text-[11px] text-gray-600 font-medium leading-tight" :class="msg.sender === 'me' ? 'items-end' : 'items-start'">
                                        <span x-show="msg.sender === 'yosali'" class="text-gray-800 font-bold mb-0.5">Yosali</span>
                                        <span x-text="msg.time"></span>
                                    </div>
                                    <template x-if="msg.sender === 'me'">
                                        <img src="https://i.ibb.co/BKtnrG9B/IMG-6557.jpg" class="w-8 h-8 rounded-full object-cover shrink-0 shadow-sm bg-gray-200">
                                    </template>
                                </div>
                                <div class="border-t border-dashed border-gray-400/60 w-full mb-2.5"></div>
                            </div>

                            <!-- 文字 -->
                            <template x-if="msg.type === 'text'">
                                <div class="wet-glass px-4 py-2.5 text-gray-900 text-[15px] leading-snug text-left w-fit break-words pointer-events-auto" 
                                     :class="msg.sender === 'me' ? 'rounded-[22px] rounded-br-[6px]' : 'rounded-[22px] rounded-bl-[6px]'">
                                    <p x-text="msg.text"></p>
                                </div>
                            </template>

                            <!-- 图片 -->
                            <template x-if="msg.type === 'image'">
                                <div class="relative pointer-events-auto overflow-hidden shadow-sm border border-white/50 bg-black/10 cursor-pointer active:scale-95 transition-transform"
                                     :class="msg.sender === 'me' ? 'rounded-[22px] rounded-br-[6px]' : 'rounded-[22px] rounded-bl-[6px]'"
                                     @click="previewImageUrl = msg.url; showImagePreview = true;">
                                    <img :src="msg.url" class="max-w-[200px] h-auto object-cover block">
                                </div>
                            </template>

                            <!-- 位置 -->
                            <template x-if="msg.type === 'location'">
                                <div class="chat-location-card cursor-pointer active:scale-95 transition-transform" @click="selectedLocation = msg.data; showLocationDetail = true;">
                                    <div class="card-header wet-glass">
                                        <div class="card-title" x-text="msg.data.name || '未命名地点'"></div>
                                        <div class="card-subtitle" x-text="msg.data.address || '暂无具体地址'"></div>
                                    </div>
                                    <div class="card-map">
                                        <div class="silver-marker-container">
                                            <div class="pin-shadow"></div>
                                            <div class="hologram-beam"></div>
                                            <div class="hologram-ring"></div>
                                            <svg class="pin-svg" viewBox="0 0 48 56" fill="none" xmlns="http://www.w3.org/2000/svg">
                                                <defs><linearGradient id="silverGradientCard" x1="10" y1="4" x2="38" y2="44" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#FFFFFF"/><stop offset="40%" stop-color="#F0F0F0"/><stop offset="100%" stop-color="#A0A0A0"/></linearGradient></defs>
                                                <path d="M24 4C14.06 4 6 12.06 6 22c0 12 18 30 18 30s18-18 18-30c0-9.94-8.06-18-18-18zm0 26c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8z" fill="url(#silverGradientCard)"/>
                                                <circle cx="24" cy="22" r="5" fill="#FFFFFF" opacity="0.9"/><circle cx="24" cy="22" r="3" fill="#D0D0D0"/>
                                            </svg>
                                            <div class="stars"><div class="star"></div><div class="star"></div><div class="star"></div><div class="star"></div></div>
                                        </div>
                                    </div>
                                </div>
                            </template>

                            <!-- 信笺转账卡片 -->
                            <template x-if="msg.type === 'transfer'">
                                <div class="wet-glass letter-card" 
                                     :class="{
                                         'state-received': msg.data.status === 'accepted',
                                         'state-returned': msg.data.status === 'rejected'
                                     }">
                                    <div class="letter-header">
                                        <div class="to-text" x-text="msg.sender === 'me' ? 'To. Yosali' : 'From. Yosali'"></div>
                                        <div class="status-text" 
                                             x-text="msg.data.status === 'accepted' ? '已收 · RECEIVED' : (msg.data.status === 'rejected' ? '已退回 · RETURNED' : msg.time)">
                                        </div>
                                    </div>
                                    <div class="amount-wrapper">
                                        <span class="currency">¥</span><span class="amount" x-text="msg.data.amount"></span>
                                    </div>
                                    <div class="message" x-text="msg.data.message || '无留言'"></div>
                                </div>
                            </template>
                        </div>
                    </div>
                </template>
            </div>

            <chat-toolbar></chat-toolbar>
        </div>

        <image-preview></image-preview>
        <call-ui></call-ui>

        <!-- 弹窗群 -->
        <div x-show="showLocationModal" class="fixed inset-0 z-[250] flex flex-col justify-end bg-black/40" style="display: none;" @click.self="showLocationModal = false">
            <div class="action-sheet">
                <div class="preview-map"><div class="silver-marker-container"><div class="pin-shadow"></div><div class="hologram-beam"></div><div class="hologram-ring"></div></div></div>
                <div class="sheet-content">
                    <div class="sheet-title">发送位置</div>
                    <div class="input-group"><input type="text" class="input-field" x-model="newLocation.name" placeholder="地名（必填）"></div>
                    <div class="action-buttons"><button class="btn btn-cancel" @click="showLocationModal = false">取消</button><button class="btn btn-send" @click="sendLocation()">发送</button></div>
                </div>
            </div>
        </div>

        <!-- 支付弹窗（简化，完整版你本地有） -->
        <div x-show="isTransferModalOpen" x-cloak class="fixed inset-0 z-[600] flex items-center justify-center px-4 bg-black/40 backdrop-blur-sm" @click.self="isTransferModalOpen = false">
             <div class="w-[310px] transfer-modal rounded-[24px] p-6 relative bg-white">
                 <div class="text-center mb-4">转账弹窗</div>
                 <button @click="isTransferModalOpen = false" class="w-full py-2 bg-gray-200 rounded">关闭</button>
             </div>
        </div>
    </div>

    <!-- 👇 把所有依赖放到 body 最底部，保证按顺序执行 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    
    <script src="./js/chat.js"></script>
    <script src="./js/call.js"></script>
    <script src="./js/map.js"></script>
    <script src="./js/transfer.js"></script>
    
    <script src="./js/components/chat-toolbar.js"></script>
    <script src="./js/components/call-ui.js"></script>
    <script src="./js/components/image-preview.js"></script>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
                for(let registration of registrations) {
                    registration.unregister(); // 强制注销旧的 Service Worker
                }
            });
        }
    </script>
</body>
</html>
